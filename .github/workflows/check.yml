name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run checks
        run: make check
